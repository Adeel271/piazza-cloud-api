$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "olga@example.com",
      "password": "Coursework123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
        pm.environment.set('token', pm.response.json().token);
      }
    language: text/javascript
order: 2000
