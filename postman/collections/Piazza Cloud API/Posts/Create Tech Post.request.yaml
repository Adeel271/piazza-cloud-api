$kind: http-request
url: "{{baseUrl}}/api/posts"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "title": "Cloud technology discussion",
      "topics": ["Tech"],
      "message": "An original Piazza message about cloud technology.",
      "expiresAt": "2030-01-01T12:00:00.000Z"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
        pm.environment.set('postId', pm.response.json().post._id);
      }
    language: text/javascript
order: 1000
